name: Verify Fern
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  engine-and-browser:
    runs-on: ubuntu-latest
    # The full suite grows with each feature milestone (M07 took 11 minutes); duration is not a
    # gate (D53), so the job limit leaves headroom while every check must still pass.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: fern-verification
          path: |
            artifacts/
            playwright-report/
          retention-days: 14
